<title>Job Hub</title>
<script>
  // Light or dark: the choice saved on this device, otherwise the device setting. Set before anything draws.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("jobhub:theme"); } catch (e) {}
    var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style id="gate-style">
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1c1b19; --muted: #6b6760; --line: #e3dfd7;
    --accent: #2f5d50; --accent-ink: #ffffff; --danger: #b3261e;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161615; --card: #201f1d; --ink: #f1eee8; --muted: #a39e95; --line: #34322e;
    --accent: #7fb8a6; --accent-ink: #10201b; --danger: #f2b8b5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body.locked { display: grid; place-items: center; padding: 16px; }
  body.checking .gate { visibility: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .gate {
    width: min(360px, 100%); padding: 32px 28px 28px; border: 1px solid var(--line);
    border-radius: 16px; background: var(--card); box-shadow: 0 12px 40px rgba(0,0,0,.06);
  }
  .mark { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 18px;
          border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
  input[type="password"] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--ink); font: inherit;
  }
  input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 18px; color: var(--muted); font-size: 13px; }
  button {
    width: 100%; padding: 11px 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .error { min-height: 20px; margin: 10px 0 0; color: var(--danger); font-size: 13px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body class="locked">
<main class="gate" id="gate">
  <div class="mark" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>
  <h1>Job Hub</h1>
  <p>Private workspace. Enter the password to continue.</p>
  <form id="unlock-form" autocomplete="on">
    <input type="text" name="username" value="job-hub" autocomplete="username" hidden>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in on this device</label>
    <button id="unlock" type="submit">Unlock</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</main>

<script>
(() => {
  "use strict";
  const KEY_STORE = "jobhub:key";
  const envelope = JSON.parse(document.getElementById("payload").textContent);
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
    del: (k) => { try { localStorage.removeItem(k); } catch (e) {} },
  };

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: fromB64(envelope.salt), iterations: envelope.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  }

  async function open(key) {
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(envelope.iv) }, key, fromB64(envelope.ct));
    } catch (e) {
      return null; // wrong password
    }
    const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }

  function lock() {
    store.del(KEY_STORE);
    location.reload();
  }

  function boot(app, key) {
    document.getElementById("gate").remove();
    document.getElementById("gate-style").remove();
    document.body.className = "";
    document.title = app.title;
    const style = document.createElement("style");
    style.textContent = app.css;
    document.head.appendChild(style);
    const root = document.createElement("div");
    root.id = "app";
    root.innerHTML = app.html;
    document.body.appendChild(root);
    new Function("JH", app.js)({ key, resumeHtml: app.resume, config: app.config, lock });
  }

  async function tryStoredKey() {
    const raw = store.get(KEY_STORE);
    if (!raw) return false;
    document.body.classList.add("checking");
    try {
      const key = await crypto.subtle.importKey("raw", fromB64(raw), "AES-GCM", true, ["encrypt", "decrypt"]);
      const app = await open(key);
      if (app) { boot(app, key); return true; }
    } catch (e) {}
    store.del(KEY_STORE);
    document.body.classList.remove("checking");
    return false;
  }

  const form = document.getElementById("unlock-form");
  const button = document.getElementById("unlock");
  const error = document.getElementById("error");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    button.disabled = true;
    button.textContent = "Unlocking…";
    error.textContent = "";
    const key = await deriveKey(document.getElementById("password").value);
    const app = await open(key);
    if (!app) {
      button.disabled = false;
      button.textContent = "Unlock";
      error.textContent = "Incorrect password.";
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      return;
    }
    if (document.getElementById("remember").checked) {
      store.set(KEY_STORE, toB64(await crypto.subtle.exportKey("raw", key)));
    }
    boot(app, key);
  });

  tryStoredKey();
})();
</script>
